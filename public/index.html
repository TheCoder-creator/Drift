<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Drift</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#050505;--panel:#121212;--accent:#00eb84;--text:#fff;--border:#292929;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit}
#tabbar{height:40px;display:flex;align-items:flex-end;gap:6px;padding:5px 10px 0;background:#101010;border-bottom:1px solid #222;flex-shrink:0}
.tab{background:#080808;border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;padding:8px 14px;color:var(--accent);font-size:12px;min-width:130px}
#newtab{height:29px;width:32px;border:1px solid #333;border-bottom:0;background:#171717;color:#aaa;border-radius:7px 7px 0 0;cursor:pointer}
#toolbar{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#101010;border-bottom:1px solid #222;flex-shrink:0}
.nav{width:35px;height:35px;border-radius:9px;border:1px solid #303030;background:#191919;color:#ccc;cursor:pointer}
.nav:hover,#go:hover{border-color:var(--accent);color:var(--accent)}
#address{flex:1;min-width:0;height:36px;border-radius:20px;border:1px solid #303030;background:#1a1a1a;color:white;padding:0 15px;outline:none;font-size:13px}
#address:focus{border-color:var(--accent)}
#go{height:36px;padding:0 17px;border:0;border-radius:20px;background:var(--accent);color:#000;font-size:11px;font-weight:800;cursor:pointer}
#status{font-size:10px;color:#888;white-space:nowrap;padding:0 4px}
#main{position:relative;flex:1;min-height:0;overflow:hidden}
#home{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:10vh 18px 30px;background:radial-gradient(ellipse at top,rgba(0,235,132,.07),transparent 55%)}
.logo{font-size:clamp(58px,9vw,82px);font-weight:900;letter-spacing:-6px;color:var(--accent);line-height:1;text-shadow:0 0 35px #00eb8430}
.sub{font-size:10px;color:#555;letter-spacing:5px;margin-top:8px}
.desc{color:#777;font-size:13px;margin-top:23px}
#searchrow{display:flex;gap:8px;width:min(620px,95%);margin-top:25px}
#start{flex:1;min-width:0;background:#151515;border:1px solid #333;border-radius:24px;color:white;padding:14px 18px;outline:none}
#start:focus{border-color:var(--accent)}
#browse{background:var(--accent);border:0;border-radius:22px;padding:0 22px;font-size:12px;font-weight:800;cursor:pointer}
.quicktitle{font-size:10px;letter-spacing:2px;color:#555;margin-top:32px}
.quick{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:13px}
.quick button{background:#151515;border:1px solid #292929;color:#aaa;border-radius:10px;padding:10px 15px;font-size:12px;cursor:pointer}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
#browser{display:none;position:absolute;inset:0;padding:12px;flex-direction:column;gap:8px}
#screenwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:#101010;border:1px solid #252525;border-radius:12px}
#screen{display:block;max-width:100%;max-height:100%;object-fit:contain;cursor:crosshair}
#typing{display:flex;gap:8px}
#typed{flex:1;min-width:0;background:#151515;border:1px solid #303030;border-radius:9px;padding:10px;color:white;outline:none}
#typing button{background:#191919;border:1px solid #333;color:#ddd;border-radius:9px;padding:0 14px;cursor:pointer}
#typing button:hover{border-color:var(--accent);color:var(--accent)}
#loading{position:absolute;inset:0;background:#080808eF;display:none;align-items:center;justify-content:center;flex-direction:column;gap:13px;color:#aaa;font-size:13px;z-index:2}
#loading.show{display:flex}
.spinner{width:24px;height:24px;border:2px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bottom{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#101010;border-top:1px solid #222;color:#555;font-size:10px;flex-shrink:0}
#bottom strong{color:var(--accent)}
@media(max-width:650px){#toolbar{gap:5px;padding:7px}.nav{width:31px;height:33px}#status{display:none}#browser{padding:6px}#typing button{padding:0 10px}.logo{letter-spacing:-4px}}
</style>
</head>
<body>
<div id="tabbar"><div class="tab"><i class="fa-solid fa-globe"></i> &nbsp;New Tab</div><button id="newtab" title="New tab"><i class="fa-solid fa-plus"></i></button></div>
<div id="toolbar">
<button class="nav" id="back" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
<button class="nav" id="forward" title="Forward"><i class="fa-solid fa-arrow-right"></i></button>
<button class="nav" id="reload" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
<button class="nav" id="homebtn" title="Home"><i class="fa-solid fa-house"></i></button>
<input id="address" placeholder="Search or enter a website address" autocomplete="off" spellcheck="false">
<button id="go">GO</button><span id="status">Ready</span>
</div>
<main id="main">
<section id="home">
<div class="logo">Drift</div><div class="sub">REMOTE CHROMIUM</div>
<p class="desc">A browser powered by remote Chromium.</p>
<form id="searchrow"><input id="start" placeholder="Search or enter a website address" autocomplete="off"><button id="browse">Browse <i class="fa-solid fa-arrow-right"></i></button></form>
<div class="quicktitle">QUICK ACCESS</div>
<div class="quick">
<button data-url="https://www.google.com"><i class="fa-brands fa-google"></i> Google</button>
<button data-url="https://www.wikipedia.org"><i class="fa-brands fa-wikipedia-w"></i> Wikipedia</button>
<button data-url="https://www.youtube.com"><i class="fa-brands fa-youtube"></i> YouTube</button>
<button data-url="https://github.com"><i class="fa-brands fa-github"></i> GitHub</button>
</div>
</section>
<section id="browser">
<div id="screenwrap"><img id="screen" alt="Remote Chromium browser view"></div>
<div id="typing"><input id="typed" placeholder="Click a field on the page, then type here"><button id="send">Send</button><button id="enter">Enter</button></div>
</section>
<div id="loading"><div class="spinner"></div><span>Connecting to remote Chromium…</span></div>
</main>
<footer id="bottom"><span>Drift <strong>Remote Chromium</strong></span><span id="sessionlabel">No active session</span></footer>
<script>
const $=id=>document.getElementById(id);
let sessionId=null,busy=false;
function setStatus(text){$("status").textContent=text;$("sessionlabel").textContent=text;}
function normalize(value){value=value.trim();if(!value)return "";if(/^https?:\/\//i.test(value))return value;if(value.includes(".")&&!value.includes(" "))return "https://"+value;return "https://www.google.com/search?q="+encodeURIComponent(value);}
function showBrowser(){ $("home").style.display="none";$("browser").style.display="flex"; }
function showHome(){ $("browser").style.display="none";$("home").style.display="flex"; }
function paint(data){if(data.image)$("screen").src="data:image/png;base64,"+data.image;if(data.url)$("address").value=data.url;setStatus((data.title||"Browsing")+(data.provider?" · "+data.provider:""));}
async function api(path,data={}){
 const response=await fetch("/api"+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)});
 const result=await response.json();if(!response.ok)throw new Error(result.error||"Request failed");return result;
}
async function openUrl(value){
 if(busy)return;const url=normalize(value);if(!url)return;
 busy=true;$("loading").classList.add("show");setStatus("Connecting…");
 try{
  let result;
  if(!sessionId){result=await api("/session",{url});sessionId=result.sessionId;}
  else result=await api("/"+sessionId+"/navigate",{url});
  showBrowser();paint(result);
 }catch(error){setStatus(error.message);}
 finally{$("loading").classList.remove("show");busy=false;}
}
async function action(name,extra={}){
 if(!sessionId||busy)return;busy=true;
 try{paint(await api("/"+sessionId+"/action",{action:name,...extra}));}
 catch(error){setStatus(error.message);}
 finally{busy=false;}
}
$("go").onclick=()=>openUrl($("address").value);
$("address").addEventListener("keydown",event=>{if(event.key==="Enter")openUrl($("address").value);});
$("searchrow").addEventListener("submit",event=>{event.preventDefault();openUrl($("start").value);});
document.querySelectorAll("[data-url]").forEach(button=>button.onclick=()=>openUrl(button.dataset.url));
$("back").onclick=()=>action("back");$("forward").onclick=()=>action("forward");$("reload").onclick=()=>action("reload");
$("homebtn").onclick=()=>sessionId?action("home"):showHome();
$("newtab").onclick=()=>{sessionId=null;$("screen").src="";$("address").value="";showHome();setStatus("New tab");};
$("screen").onclick=event=>{
 const rect=event.target.getBoundingClientRect();
 const x=(event.clientX-rect.left)/rect.width*1280;
 const y=(event.clientY-rect.top)/rect.height*800;
 action("click",{x,y});
};
$("screenwrap").addEventListener("wheel",event=>{event.preventDefault();action("scroll",{deltaY:event.deltaY});},{passive:false});
$("send").onclick=async()=>{const value=$("typed").value;if(value){await action("type",{text:value});$("typed").value="";}};
$("typed").addEventListener("keydown",event=>{if(event.key==="Enter")$("send").click();});
$("enter").onclick=()=>action("key",{key:"Enter"});
document.addEventListener("keydown",event=>{
 if(!sessionId||["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;
 const keys=["Enter","Tab","Escape","Backspace","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"];
 if(keys.includes(event.key)){event.preventDefault();action("key",{key:event.key});}
});
window.addEventListener("pagehide",()=>{if(sessionId)navigator.sendBeacon("/api/"+sessionId+"/close",new Blob(["{}"],{type:"application/json"}));});
</script>
</body>
</html>
