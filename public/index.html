<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Drift</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#050505;--nav:#121212;--accent:#00eb84;--card:rgba(20,20,20,.95);--text:#fff;--border:#333;--glass:rgba(18,18,18,.94)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit}
#tab-bar{background:var(--glass);backdrop-filter:blur(12px);display:flex;padding:6px 10px 0;gap:5px;border-bottom:1px solid var(--border);min-height:39px;align-items:flex-end;flex-shrink:0}
.tab{background:rgba(255,255,255,.04);padding:8px 12px;border-radius:8px 8px 0 0;font-size:12px;border:1px solid transparent;border-bottom:none;color:#777;min-width:105px;max-width:190px;display:flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden}
.tab.active{background:#080808;border-color:var(--accent);color:var(--accent);font-weight:700}
.tab span:first-of-type{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab-close{cursor:pointer;opacity:.55}
.tab-close:hover{color:#ff5555;opacity:1}
#add-tab{background:rgba(255,255,255,.06);border:1px dashed var(--border);color:#777;padding:7px 12px;border-radius:8px 8px 0 0;cursor:pointer}
#add-tab:hover{border-color:var(--accent);color:var(--accent)}
#nav-tools{background:var(--glass);backdrop-filter:blur(12px);padding:8px 10px;display:flex;gap:8px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.nav-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#ccc;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,235,132,.08)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
#address-wrap{flex:1;position:relative;min-width:0}
#address{width:100%;padding:10px 16px;border-radius:20px;border:1px solid var(--border);background:rgba(26,26,26,.95);color:#fff;outline:none;font-size:13px}
#address:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,235,132,.15)}
#go{background:var(--accent);color:#000;border:0;border-radius:18px;padding:10px 17px;font-size:12px;font-weight:800;cursor:pointer}
#go:hover{filter:brightness(1.12)}
#status-bar{display:flex;gap:5px;padding:0 5px;font-size:12px;color:#888;align-items:center;white-space:nowrap}
#status-dot{width:7px;height:7px;border-radius:50%;background:#666}
#status-dot.online{background:var(--accent);box-shadow:0 0 8px var(--accent)}
#viewport{flex:1;position:relative;overflow:hidden;background:#080808;min-height:0}
#home-view{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10vh 20px 30px;overflow:auto;background:radial-gradient(ellipse at top,rgba(0,235,132,.07),transparent 52%)}
.logo{font-size:clamp(58px,9vw,82px);font-weight:900;color:var(--accent);letter-spacing:-6px;text-shadow:0 0 40px rgba(0,235,132,.25);line-height:1}
.logo-sub{font-size:11px;color:#555;letter-spacing:6px;text-transform:uppercase;margin-top:7px}
.home-description{font-size:13px;color:#777;margin-top:22px;text-align:center}
.mid-search{width:min(90%,620px);background:var(--card);padding:7px 7px 7px 19px;border-radius:50px;border:1px solid var(--border);display:flex;gap:10px;margin-top:24px;align-items:center;transition:.2s}
.mid-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,235,132,.1)}
.mid-search i{color:#666}
.mid-search input{flex:1;min-width:0;background:none;border:none;color:#fff;outline:none;font-size:14px;padding:9px 0}
#home-go{background:var(--accent);color:#000;border:0;padding:11px 20px;border-radius:50px;font-weight:800;cursor:pointer;font-size:12px}
.quick-title{margin-top:30px;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1.7px}
.quick-links{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:12px}
.quick-link{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:10px 15px;border-radius:12px;color:#aaa;font-size:12px;cursor:pointer}
.quick-link:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,235,132,.06)}
#browser-view{display:none;position:absolute;inset:0;background:#080808}
#browser-view.active{display:block}
#browser-frame{width:100%;height:100%;border:0;background:#fff;display:block}
#loading{display:none;position:absolute;inset:0;z-index:5;background:rgba(5,5,5,.88);align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#bbb;font-size:13px}
#loading.show{display:flex}
.spinner{width:25px;height:25px;border:2px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#empty-error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:25px;color:#aaa;font-size:13px;line-height:1.7;background:#080808}
#empty-error.show{display:flex}
#bottom-bar{height:27px;background:rgba(15,15,15,.97);border-top:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#555;font-size:10px;flex-shrink:0}
#bottom-bar strong{color:var(--accent);font-weight:700}
@media(max-width:650px){#status-bar{display:none}.nav-btn{width:33px;height:33px}#nav-tools{gap:5px;padding:7px}.logo{letter-spacing:-4px}.mid-search{width:100%}.tab{min-width:80px;padding:7px 9px}}
</style>
</head>
<body>
<div id="tab-bar">
  <div class="tab active" id="main-tab"><i class="fa-solid fa-house"></i><span>Drift Home</span></div>
  <button id="add-tab" title="New tab" type="button"><i class="fa-solid fa-plus"></i></button>
</div>

<div id="nav-tools">
  <button class="nav-btn" id="home-btn" title="Home"><i class="fa-solid fa-house"></i></button>
  <button class="nav-btn" id="reload-btn" title="Reload remote view"><i class="fa-solid fa-rotate-right"></i></button>
  <div id="address-wrap">
    <input id="address" type="text" placeholder="Search or enter a website address" autocomplete="url" spellcheck="false">
  </div>
  <button id="go" type="button">GO</button>
  <div id="status-bar"><span id="status-dot"></span><span id="status-text">Ready</span></div>
</div>

<main id="viewport">
  <section id="home-view">
    <div class="logo">Drift</div>
    <div class="logo-sub">REMOTE CHROMIUM</div>
    <p class="home-description">A browser powered by remote Chromium.</p>
    <form class="mid-search" id="home-form">
      <i class="fa-solid fa-globe"></i>
      <input id="home-address" type="text" placeholder="Search or enter a website address" autocomplete="url" spellcheck="false">
      <button id="home-go" type="submit">Browse <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <div class="quick-title">Quick access</div>
    <div class="quick-links">
      <button class="quick-link" data-url="https://www.google.com"><i class="fa-brands fa-google"></i> Google</button>
      <button class="quick-link" data-url="https://www.wikipedia.org"><i class="fa-brands fa-wikipedia-w"></i> Wikipedia</button>
      <button class="quick-link" data-url="https://www.youtube.com"><i class="fa-brands fa-youtube"></i> YouTube</button>
    </div>
  </section>

  <section id="browser-view">
    <iframe id="browser-frame" title="Drift remote Chromium browser" allow="clipboard-read; clipboard-write; fullscreen; autoplay" referrerpolicy="no-referrer"></iframe>
  </section>

  <div id="loading"><div class="spinner"></div><span>Starting remote Chromium…</span></div>
  <div id="empty-error"></div>
</main>

<footer id="bottom-bar">
  <span>Drift <strong>Remote Chromium</strong></span>
  <span id="session-label">No active session</span>
</footer>

<script>
const $=id=>document.getElementById(id);
const homeView=$("home-view");
const browserView=$("browser-view");
const frame=$("browser-frame");
const loading=$("loading");
const errorBox=$("empty-error");
const address=$("address");
const homeAddress=$("home-address");
const statusText=$("status-text");
const statusDot=$("status-dot");
let currentSessionId=null;
let currentUrl="";
let lastLiveViewUrl="";

function setStatus(text,online=false){
  statusText.textContent=text;
  statusDot.classList.toggle("online",online);
}
function normalizeAddress(value){
  let valueTrimmed=value.trim();
  if(!valueTrimmed)return "";
  if(!valueTrimmed.includes(".")&&!valueTrimmed.includes("://")&&!valueTrimmed.includes("/")){
    return "https://www.google.com/search?q="+encodeURIComponent(valueTrimmed);
  }
  if(!/^https?:\/\//i.test(valueTrimmed))valueTrimmed="https://"+valueTrimmed;
  return valueTrimmed;
}
async function openWebsite(value){
  const destination=normalizeAddress(value);
  if(!destination)return;
  address.value=destination;
  homeAddress.value=destination;
  errorBox.classList.remove("show");
  loading.classList.add("show");
  homeView.style.display="none";
  browserView.classList.add("active");
  setStatus("Connecting…");
  $("session-label").textContent="Starting session";

  try{
    const response=await fetch("/api/open",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({url:destination})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Could not start the remote browser.");

    currentSessionId=data.sessionId;
    currentUrl=data.destination||destination;
    lastLiveViewUrl=data.liveViewUrl;
    frame.src=lastLiveViewUrl;
    $("session-label").textContent="Remote session active";
    setStatus("Connected",true);
  }catch(error){
    browserView.classList.remove("active");
    homeView.style.display="flex";
    errorBox.innerHTML="<div><strong style='color:#ff657a'>Could not open the website</strong><br>"+escapeHtml(error.message)+"<br><br>Check the Worker deployment and Browser Run binding, then try again.</div>";
    errorBox.classList.add("show");
    setStatus("Connection failed");
    $("session-label").textContent="No active session";
  }finally{
    loading.classList.remove("show");
  }
}
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showHome(){
  browserView.classList.remove("active");
  homeView.style.display="flex";
  errorBox.classList.remove("show");
  address.value="";
  setStatus("Ready");
}
$("home-form").addEventListener("submit",e=>{e.preventDefault();openWebsite(homeAddress.value);});
$("go").addEventListener("click",()=>openWebsite(address.value));
address.addEventListener("keydown",e=>{if(e.key==="Enter")openWebsite(address.value);});
$("home-btn").addEventListener("click",showHome);
$("reload-btn").addEventListener("click",()=>{
  if(lastLiveViewUrl&&browserView.classList.contains("active")){
    frame.src=lastLiveViewUrl;
    setStatus("Reconnecting…");
  }else{
    showHome();
  }
});
$("add-tab").addEventListener("click",showHome);
document.querySelectorAll(".quick-link").forEach(button=>{
  button.addEventListener("click",()=>openWebsite(button.dataset.url));
});
frame.addEventListener("load",()=>{
  if(frame.src&&frame.src!=="about:blank"){
    loading.classList.remove("show");
    setStatus("Connected",true);
  }
});
</script>
</body>
</html>
